<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">KiteMarket market stall</title>
  <desc id="desc">An original market stall with a kite and exchange mark on a rounded violet gradient tile.</desc>
  <defs>
    <linearGradient id="marketViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="42%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="coinGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#marketViolet)"/>

  <!-- A soft kite silhouette makes the mark distinct without adding small details. -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" opacity=".25">
    <path stroke-width="14" d="M256 56 328 126 256 198 184 126Z"/>
    <path stroke-width="10" d="M256 198c2 35 22 47 44 62"/>
    <path stroke-width="12" d="m300 260 16 2-8 14"/>
  </g>

  <!-- Stall canopy and counter. -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#FFFFFF" stroke-width="14" d="M86 236 116 146h280l30 90Z"/>
    <path fill="#7C3AED" stroke="none" d="M144 146h52l-26 90h-54Z"/>
    <path fill="#7C3AED" stroke="none" d="M248 146h52l26 90h-52Z"/>
    <path fill="#FFFFFF" stroke-width="14" d="M86 236h340v24c0 29-23 52-52 52s-52-23-52-52c0 29-23 52-52 52s-52-23-52-52c0 29-23 52-52 52s-52-23-52-52c0 29-23 52-52 52s-52-23-52-52Z"/>
    <path fill="#FFFFFF" stroke-width="18" d="M122 312v102h268V312"/>
    <path fill="#FFFFFF" stroke-width="18" d="M96 414h320"/>
  </g>

  <!-- Exchange coin, kept large enough for small icon sizes. -->
  <circle cx="256" cy="354" r="58" fill="url(#coinGold)" stroke="#FFFFFF" stroke-width="12"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M224 342h64m-16-16 16 16-16 16"/>
    <path d="M288 366h-64m16-16-16 16 16 16"/>
  </g>
</svg>
