<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1024" height="1024" shape-rendering="crispEdges" role="img" aria-label="KiteMarket market stall">
  <title>KiteMarket market stall</title>
  <desc>An original pixel market stall with a moss-green cloth awning, a wooden counter and a gold exchange sign. Transparent background.</desc>
  <!-- Dark, stepped silhouette keeps the stall readable at small sizes. -->
  <path fill="#283d32" d="M18 4h28v4h8v4h4v8h4v10h-4v4H6v-4H2V20h4v-8h4V8h8z"/>
  <path fill="#5c7949" d="M18 8h28v4h8v8h4v6H6v-6h4v-8h8z"/>
  <path fill="#86a462" d="M18 8h8v4h-4v8h-4v6H8v-6h4v-8h6z"/>
  <path fill="#b1bc7a" d="M28 8h8v18H24v-6h2v-8h2z"/>
  <path fill="#86a462" d="M38 8h8v4h6v8h4v6H42v-6h-2v-8h-2z"/>
  <rect x="18" y="8" width="28" height="2" fill="#d2d7a3"/>
  <rect x="6" y="24" width="52" height="4" fill="#344e38"/>
  <rect x="6" y="28" width="10" height="4" fill="#7f9c59"/>
  <rect x="16" y="28" width="10" height="4" fill="#b1bc7a"/>
  <rect x="26" y="28" width="12" height="4" fill="#7f9c59"/>
  <rect x="38" y="28" width="10" height="4" fill="#b1bc7a"/>
  <rect x="48" y="28" width="10" height="4" fill="#7f9c59"/>
  <!-- Posts and feet. -->
  <rect x="6" y="34" width="8" height="24" fill="#4b3028"/>
  <rect x="8" y="34" width="4" height="24" fill="#ac7847"/>
  <rect x="8" y="34" width="2" height="24" fill="#d9a269"/>
  <rect x="50" y="34" width="8" height="24" fill="#4b3028"/>
  <rect x="52" y="34" width="4" height="24" fill="#ac7847"/>
  <rect x="52" y="34" width="2" height="24" fill="#d9a269"/>
  <rect x="4" y="56" width="12" height="4" fill="#4b3028"/>
  <rect x="48" y="56" width="12" height="4" fill="#4b3028"/>
  <!-- Small crate and paper packet are part of the stall, not UI artwork. -->
  <rect x="16" y="36" width="10" height="8" fill="#4b3028"/>
  <rect x="18" y="38" width="6" height="6" fill="#d49c5e"/>
  <rect x="18" y="40" width="6" height="2" fill="#91603a"/>
  <rect x="42" y="38" width="6" height="6" fill="#e8d6ae"/>
  <rect x="44" y="38" width="2" height="6" fill="#bda875"/>
  <!-- Counter. -->
  <rect x="12" y="42" width="40" height="16" fill="#4b3028"/>
  <rect x="14" y="46" width="36" height="10" fill="#ac7847"/>
  <rect x="14" y="46" width="36" height="2" fill="#d9a269"/>
  <rect x="14" y="52" width="36" height="2" fill="#805132"/>
  <rect x="24" y="48" width="2" height="8" fill="#805132"/>
  <rect x="38" y="48" width="2" height="8" fill="#805132"/>
  <rect x="10" y="42" width="44" height="4" fill="#4b3028"/>
  <rect x="12" y="42" width="40" height="2" fill="#e0ab70"/>
