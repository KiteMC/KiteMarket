      <circle cx="38" cy="36" r="13" fill="#fbbf24"/>
      <text x="69" y="48" fill="#fff" font-size="29" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Auctions</text>
    </g>
  </g>

  <text x="132" y="756" fill="#c4b5fd" font-size="29" font-family="Segoe UI, Arial, sans-serif">Shared wallets · Claim storage · History · Developer SDK</text>
