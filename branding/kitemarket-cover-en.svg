  <text x="128" y="360" fill="#fff" font-size="104" font-family="Segoe UI, Arial, sans-serif" font-weight="800">KiteMarket</text>
  <text x="134" y="443" fill="#ede9fe" font-size="42" font-family="Segoe UI, Arial, sans-serif" font-weight="500">Advanced player markets · Every trade stays clear</text>

  <g transform="translate(132 536)">
    <g>
      <rect width="250" height="72" rx="36" fill="#fff" opacity=".12"/>
      <circle cx="38" cy="36" r="13" fill="#34d399"/>
      <text x="69" y="48" fill="#fff" font-size="29" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Buy Orders</text>
    </g>
    <g transform="translate(270)">
