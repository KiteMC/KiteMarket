<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">KiteMarket Advanced Player Market</title>
  <desc id="desc">KiteMarket English wide product cover for buy orders, fixed-price sales, auctions and shared wallets.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211235"/>
      <stop offset="48%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0b0614" flood-opacity=".38"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1550" cy="140" r="360" fill="#8b5cf6" opacity=".14" filter="url(#glow)"/>
  <circle cx="240" cy="1000" r="430" fill="#22d3ee" opacity=".07" filter="url(#glow)"/>
  <g fill="#fff" opacity=".1">
    <circle cx="149" cy="176" r="3"/><circle cx="330" cy="118" r="4"/><circle cx="603" cy="206" r="3"/>
    <circle cx="893" cy="102" r="4"/><circle cx="1108" cy="166" r="3"/><circle cx="1750" cy="260" r="4"/>
    <circle cx="1630" cy="870" r="3"/><circle cx="1450" cy="950" r="4"/><circle cx="970" cy="946" r="3"/>
  </g>

  <g transform="translate(128 126)">
    <rect width="92" height="92" rx="24" fill="#fff" opacity=".13"/>
