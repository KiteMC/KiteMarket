      <circle cx="38" cy="36" r="13" fill="#60a5fa"/>
      <text x="69" y="48" fill="#fff" font-size="29" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Fixed-Price Sales</text>
    </g>
